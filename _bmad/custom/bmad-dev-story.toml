# Imoveis project overrides for the deprecated bmad-dev-story shim (identical to bmad-build.toml; remove with the shim).
# Merges over the skill's customize.toml (arrays append). ADR 0007.

[workflow]

persistent_facts = [
  "GATE: the ONLY validation is `python scripts/agent/validate.py` (tier chosen from the diff; `--tier backend|full` to force). Never run raw `pytest`/`npm test` to validate — the gate builds the isolated ephemeral test stack and writes the validation stamp a push to main requires. Every spec's `## Verification` section lists that command with expected exit 0.",
  "PRIMARY STACK IS OPERATOR-OWNED: never run `docker compose` lifecycle commands against the primary project `imoveis` (a PreToolUse hook denies them). Tests use the ephemeral `<workspace>-test` stack validate.py creates. Primary DB migration is only the operator step `bash scripts/agent/migrate-primary.sh`. A stuck docker state is halt-and-escalate, never improvised cleanup.",
  "SHIPPING: `python scripts/agent/ship.py` (validate → squash-merge into main → push). Pushes to main are hook-gated on the validation stamp; never force-push. On a `bmad-loop/<run>/<story>` branch the orchestrator merges: commit, validate, end the session — never ship or rename such a branch.",
  "Scope: stay inside the story; more than 3 unexpected files means STOP and ask. Every story ships `docs/features/<story-key>-<slug>.md` (ship.py checks story-key branches). Every `fix:` ships a regression test that fails without it.",
]
