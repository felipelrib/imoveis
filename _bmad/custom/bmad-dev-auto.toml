# Imoveis project overrides for bmad-dev-auto (CAP-6, v0.13-fu1 harness surgery).
# Unattended loop iterations are held to the same gates as interactive dev.
# Merges over the skill's customize.toml (arrays append).

[workflow]

persistent_facts = [
  "GATE (non-negotiable): validation is ONLY `bash scripts/agent/validate.sh [fast|backend|all]`. NEVER run raw `pytest`, `npm test`, or ad-hoc test commands — the gate derives the isolated ephemeral test-stack env that raw runners miss.",
  "GATE (non-negotiable): finishing is ONLY `bash scripts/agent/finish-feature.sh` (validate → local squash-merge to main → mandatory `git push origin main` → cleanup). There is no PR step and no remote CI gate. Run it with a generous timeout or in the background — it takes minutes. EXCEPTION — on a `bmad-loop/<run>/<story>` branch (a bmad-loop orchestrator worktree): the ORCHESTRATOR owns merge-back and runs it after its review pass. There, finishing means commit on the branch + `bash scripts/agent/validate.sh all` green + end the session; `finish-feature.sh` refuses these branches BY DESIGN — never merge by hand and never rename the branch to dodge the refusal.",
  "PRIMARY STACK IS INVIOLABLE: never run any `docker compose` command against the primary project `imoveis` (up/down/restart/stop/build/run). DB/Redis for tests come from `bash scripts/agent/test-stack.sh` (ephemeral `<workspace>-test` project). Primary DB migration is exclusively the operator step `bash scripts/agent/migrate-primary.sh`. A stuck or ambiguous docker state is a HALT-and-escalate, never an improvised `docker` cleanup.",
  "Domain hooks are merge-blocking and unweakenable: scraper changes → `bash scripts/agent/validate-scrapers.sh --require-live`; AI prompt/client changes → `bash scripts/agent/validate-ai.sh`; API schema changes → contract tests; DB schema changes → `alembic check`.",
]
