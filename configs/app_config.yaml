# =============================================================================
# Application Configuration — Single Source of Truth
# =============================================================================
# Environment variable overrides:
#   DATABASE_URL  — PostgreSQL connection string
#   REDIS_URL     — Redis connection string
#   AI_MODEL      — Override the default VLM model name
#   API_KEY       — API edge credential (auth.api_key)
#   JWT_SECRET    — JWT signing secret (auth.jwt_secret)
#   ADMIN_USER / ADMIN_PASS — admin login (auth.admin_*)
#   IMOVEIS_AUTH__* — generic auth overrides (e.g. IMOVEIS_AUTH__PRINCIPAL_ID)
#   IMOVEIS_API__CORS_ORIGINS — generic override for api.cors_origins

database: {}

# ---------------------------------------------------------------------------
# API edge auth (BIN-44) — secrets via env only; never commit real values
# ---------------------------------------------------------------------------
auth:
  api_key: ""
  jwt_secret: ""
  principal_id: default
  admin_user: ""
  admin_pass: ""

# ---------------------------------------------------------------------------
# API edge (BIN-136) — CORS allowlist; deployments with a different frontend
# origin (staging domain, LAN IP, custom port) edit this instead of main.py.
# ---------------------------------------------------------------------------
api:
  cors_origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://127.0.0.1:5173

# ---------------------------------------------------------------------------
# UI locale (BIN-98) — chrome default; independent of ai.output_language
# Runtime override: Redis key ui:locale via GET/POST /admin/locale
# ---------------------------------------------------------------------------
ui:
  locale: en
  supported_locales:
    - en
    - pt-BR

redis_url: redis://localhost:6379/0

# ---------------------------------------------------------------------------
# Platform Scrapers
# ---------------------------------------------------------------------------
scraping:
  # Reject listings whose city/state fall outside operator geo (BIN-68).
  # Missing city is rejected; keep-list: BH / São Paulo / Campinas.
  geo_allowlist:
    enabled: true
    cities:
      - Belo Horizonte
      - São Paulo
      - Campinas
    states:
      - MG
      - SP
  # Reject thin galleries for AI scoring / deal feed (BIN-78).
  # effective_min = max(floor_min, ceil(ai.max_images_per_property * coverage_ratio))
  # Under-threshold rows stay in DB as active=false for offline price/geo stats.
  photo_gate:
    enabled: true
    floor_min: 8          # whole-home coverage (rooms + wet areas + common spaces)
    coverage_ratio: 1.0   # require a full VLM image budget worth of photos
    min_photos: null      # set to an int to force a fixed threshold
  # Soft-deactivate listings whose source URLs went dark (BIN-80). Never deletes.
  availability_recheck:
    enabled: true
    interval_minutes: 360   # Celery beat cadence
    batch_size: 50          # listings per run (oldest last_seen first)
    stale_after_hours: 24   # skip listings seen more recently than this
    request_timeout_sec: 20
  # After OLX location reconcile clears seller coords and name-assigns a
  # neighbourhood, optionally fill a neighbourhood-level pin (BIN-112).
  # Never invents street precision — uses ST_PointOnSurface of the polygon.
  olx_location:
    backfill_coords_from_neighbourhood: true
  # Cloudflare bypass (BIN-246 / BIN-247). OLX (and intermittently ZAP) 403 plain
  # HTTP clients with a JS challenge; the FlareSolverr sidecar (a real headless
  # browser) solves it. Requires `docker compose --profile bypass up -d
  # flaresolverr`. See docs/setup.md § Cloudflare bypass.
  #   platforms:     ALWAYS bypass (every GET → FlareSolverr) — for providers that
  #                  403 on ~100% of requests, so a direct attempt is pure waste.
  #   auto_fallback: any OTHER platform fetches directly first and only retries a
  #                  Cloudflare 403 through FlareSolverr (then sticks to it). New
  #                  Cloudflare-gated providers are handled automatically; un-gated
  #                  ones (QuintoAndar) never touch FlareSolverr.
  cloudflare_bypass:
    enabled: true
    endpoint: http://flaresolverr:8191/v1   # FlareSolverr /v1 API (compose network)
    max_timeout_ms: 60000                    # max browser solve time per request
    auto_fallback: true                      # direct-first, FlareSolverr on 403 (non-listed)
    platforms:
      - olx
  platforms:
    quintoandar:
      base_url: https://www.quintoandar.com.br/alugar/imovel/belo-horizonte-mg-brasil
      enabled: true
      scrape_interval: 60      # minutes between scheduled scrapes (0 = manual only)
      rate_limit: 30          # requests per minute
      jitter_min: 2           # minimum delay between requests (seconds)
      jitter_max: 7           # maximum delay between requests (seconds)
      extra:
        # Multi-city windows (BIN-113). Remove a city entry to stop scraping it;
        # add {slug} / {slug,zone} under neighborhoods to deepen coverage.
        # Rebuild worker_scraper after config changes.
        price_rent: [500, 15000]
        price_sale: [100000, 5000000]
        cities:
          - city_slug: belo-horizonte-mg-brasil
            # Fan-out only when a price band is atomic and still ≥12 results
            neighborhoods:
              - { slug: savassi }
              - { slug: lourdes }
              - { slug: funcionarios }
              - { slug: centro }
              - { slug: santo-agostinho }
              - { slug: serra }
              - { slug: sion }
              - { slug: cruzeiro }
              - { slug: anchieta }
              - { slug: belvedere }
              - { slug: santo-antonio }
              - { slug: carmo }
              - { slug: santa-efigenia }
              - { slug: floresta }
              - { slug: santa-tereza }
              - { slug: buritis }
              - { slug: gutierrez }
              - { slug: prado }
              - { slug: barro-preto }
              - { slug: castelo }
              - { slug: ouro-preto }
              - { slug: bandeirantes }
              - { slug: sao-luiz }
              - { slug: caicaras }
              - { slug: carlos-prates }
              - { slug: planalto }
              - { slug: cidade-nova }
              - { slug: venda-nova }
              - { slug: barreiro }
              - { slug: nova-suissa }
              - { slug: calafate }
              - { slug: mangabeiras }
              - { slug: luxemburgo }
              - { slug: santo-andre }
              - { slug: bonfim }
          - city_slug: sao-paulo-sp-brasil
            neighborhoods: []
          - city_slug: campinas-sp-brasil
            neighborhoods: []
        # null → use global proxy: block; non-null URL → fixed override (no rotation)
        proxy: null
    olx:
      base_url: https://www.olx.com.br
      enabled: true
      scrape_interval: 60      # minutes between scheduled scrapes (0 = manual only)
      rate_limit: 20
      jitter_min: 2
      jitter_max: 6
      extra:
        max_pages: 5
        page_size_hint: 50
        # Multi-city windows (BIN-113). Empty neighborhoods = city-wide price
        # bisect only. Rebuild worker_scraper after config changes.
        price_rent: [500, 15000]
        price_sale: [100000, 5000000]
        cities:
          - region: estado-mg
            city_slug: belo-horizonte-e-regiao
            # Fan-out only when a price band is atomic and still saturates max_pages
            neighborhoods:
              - { slug: savassi, zone: centro-sul }
              - { slug: lourdes, zone: centro-sul }
              - { slug: funcionarios, zone: centro-sul }
              - { slug: centro, zone: centro-sul }
              - { slug: santo-agostinho, zone: centro-sul }
              - { slug: serra, zone: centro-sul }
              - { slug: sion, zone: centro-sul }
              - { slug: cruzeiro, zone: centro-sul }
              - { slug: anchieta, zone: centro-sul }
              - { slug: belvedere, zone: centro-sul }
              - { slug: santo-antonio, zone: centro-sul }
              - { slug: carmo, zone: centro-sul }
              - { slug: mangabeiras, zone: centro-sul }
              - { slug: luxemburgo, zone: centro-sul }
              - { slug: santa-efigenia, zone: zona-leste }
              - { slug: floresta, zone: zona-leste }
              - { slug: santa-tereza, zone: zona-leste }
              - { slug: horto, zone: zona-leste }
              - { slug: buritis, zone: oeste }
              - { slug: gutierrez, zone: oeste }
              - { slug: prado, zone: oeste }
              - { slug: barro-preto, zone: oeste }
              - { slug: nova-suissa, zone: oeste }
              - { slug: calafate, zone: oeste }
              - { slug: castelo, zone: pampulha }
              - { slug: ouro-preto, zone: pampulha }
              - { slug: bandeirantes, zone: pampulha }
              - { slug: sao-luiz, zone: pampulha }
              - { slug: caicaras, zone: noroeste }
              - { slug: carlos-prates, zone: noroeste }
              - { slug: bonfim, zone: noroeste }
              - { slug: santo-andre, zone: noroeste }
              - { slug: planalto, zone: venda-nova }
              - { slug: cidade-nova, zone: nordeste }
              - { slug: venda-nova, zone: venda-nova }
              - { slug: barreiro, zone: barreiro }
          - region: estado-sp
            city_slug: sao-paulo-e-regiao
            neighborhoods: []
          - region: estado-sp
            city_slug: campinas-e-regiao
            neighborhoods: []
        # null → use global proxy: block; non-null URL → fixed override (no rotation)
        proxy: null
    zapimoveis:
      base_url: https://www.zapimoveis.com.br
      enabled: true
      scrape_interval: 60      # minutes between scheduled scrapes (0 = manual only)
      rate_limit: 20
      jitter_min: 2
      jitter_max: 6
      extra:
        max_pages: 5
        # Multi-city shells (BIN-113 / BIN-127). Empty neighborhoods = city-wide
        # price bisect only. Rebuild worker_scraper after config changes.
        price_rent: [500, 15000]
        price_sale: [100000, 5000000]
        cities:
          - city_slug: mg+belo-horizonte
            neighborhoods: []
          - city_slug: sp+sao-paulo
            neighborhoods: []
          - city_slug: sp+campinas
            neighborhoods: []
        # null → use global proxy: block; non-null URL → fixed override (no rotation)
        proxy: null

# ---------------------------------------------------------------------------
# Deduplication Engine
# ---------------------------------------------------------------------------
dedup:
  radius_m: 50.0                    # geospatial proximity radius in meters
  area_tolerance_m2: 2.0            # ±m² tolerance for usable area matching
  text_similarity_threshold: 0.65   # minimum similarity score to consider duplicate
  text_similarity_algorithm: jaro_winkler  # jaro_winkler | token_sort

# ---------------------------------------------------------------------------
# Scoring Engine
# ---------------------------------------------------------------------------
scoring:
  stat_weight: 0.4              # statistical z-score/percentile component
  ai_weight: 0.4                # AI qualitative assessment (visual + listing claims)
  neighbourhood_weight: 0.2     # objective neighbourhood quality profile (BIN-94)

# ---------------------------------------------------------------------------
# Local AI / VLM
# ---------------------------------------------------------------------------
ai:
  backend: ollama             # ollama | lmstudio | gemini | gemma
  # Per-task-class BACKFILL backend routing — the source of truth for which
  # backend each enrichment task class is eligible to run on during backfill.
  # The live/incremental path is always LOCAL (never reads this map). Cloud
  # values (gemini/gemma) are allowed HERE (backfill-eligibility) but FORBIDDEN
  # on ai.backend above, which is the live-path selector and must stay local.
  enrichment_routing:
    visual: ollama            # visual condition assessment (VLM)
    sentiment: ollama         # neighbourhood sentiment
    deal_verdict: ollama      # deal verdict summary
    valuation: ollama         # statistical valuation
    embedding: ollama         # bge-m3 property embeddings
  ollama_url: http://localhost:11434
  lmstudio_url: http://localhost:1234
  # Gemini/Gemma (OpenAI-compatible endpoint). GEMINI_API_KEY comes from env
  # only — never commit a key here. GEMINI_MODEL env overrides gemini_model.
  gemini_url: https://generativelanguage.googleapis.com/v1beta/openai
  gemini_model: gemini-2.5-flash
  gemma_model: gemma-4-31b-it # backend: gemma + the BIN-248 backfill runner
  gemini_api_key: ""          # env: GEMINI_API_KEY (leave blank in YAML)
  # A throttled free-tier project sometimes stops answering instead of returning
  # 429, so the refusal arrives as identical connection resets/timeouts (DW-7).
  # Repeated identical transport failures count as quota (rolling the backfill
  # attempt back) only when the provider actually refused on quota within this
  # many seconds. 0 disables the inference — every reset is a hard row error;
  # 3600 is the ceiling (a wider window would suppress row errors all day).
  gemini_transport_quota_window_seconds: 300.0
  # Single generative VLM for photos + text JSON (sentiment, OLX location, verdict)
  visual_model: qwen2.5vl:7b
  text_model: qwen2.5vl:7b
  embedding_model: bge-m3     # multilingual 1024-d (requires properties.embedding vector(1024))
  timeout: 120
  max_tokens: 1024            # Ollama num_predict
  # Context window for generate calls. 16384 supports listing prompts + ~8 images on
  # qwen2.5vl:7b when you have VRAM headroom (drop to 8192 if OOM).
  num_ctx: 16384
  visual_weight: 0.7
  text_weight: 0.3
  max_images_per_property: 8
  max_description_chars: 1000
  output_language: "en"
  # Longest-side px cap applied before every VLM call (BIN-248). 768 matched
  # full-res Gemma quality and fixed Ollama's visual errors in the BIN-242 A/B.
  # 0 disables downscaling.
  image_max_dimension: 768

# ---------------------------------------------------------------------------
# GPU Resource Management
# ---------------------------------------------------------------------------
gpu:
  # Safe on RX 7900 XT 20GB with OLLAMA_NUM_PARALLEL=2, num_ctx=16384, 8 images
  # (bench case D ~7GB VRAM, 0 spill). Keep NUM_PARALLEL == this limit.
  semaphore_limit: 2    # max concurrent GPU-bound tasks
  max_semaphore_limit: 8  # hard ceiling accepted by admin /gpu/scale (BIN-159)
  semaphore_name: gpu

# ---------------------------------------------------------------------------
# Gemma free-tier enrichment backfill runner (BIN-248)
# ---------------------------------------------------------------------------
# Standalone RPD-paced runner (scripts/dev/backfill_gemma.py). Paces on the
# remote provider's daily request budget instead of the GPU semaphore. Defaults
# stay under Gemma's free-tier 14,400 RPD / 16K TPM (~6-day full pass).
backfill:
  daily_request_budget: 14000  # < 14,400 free-tier RPD; ~4,600 props/day
  tpm_limit: 16000             # free-tier TPM — the binding limit in practice
  # Measured per-property token cost (gemma-4-31b-it, 8×768px images):
  # visual ~3,538 + sentiment ~1,706 + verdict ~1,706. 16K TPM → ~2.3 props/min.
  tokens_per_property: 7000
  tpm_safety_margin: 0.9       # use 90% of tpm_limit for headroom
  rpm_limit: 30                # free-tier Gemma ~30 RPM; bounds the launch rate
  requests_per_property: 3     # visual + sentiment + verdict
  concurrency: 1               # parallel properties (BIN-269); 1 = sequential
  # Attempts one property gets before it is quarantined out of the work queue
  # (v0.13-fu3). Rows that error every cycle — or enrich to a falsy ai_score and
  # so stay `mode=missing` candidates — otherwise burn RPD/TPM forever.
  # Release them with `--reset-quarantine`.
  max_attempts: 3
  batch_size: 50
  redis_prefix: "backfill:gemma"
  # Single-instance lease (v0.13-s1.3). Only one runner may hold
  # `<redis_prefix>:lease`; a second start is refused. The runner renews the
  # lease as it works, so this TTL is how long after a hard kill the lease
  # frees itself — no operator cleanup needed.
  lease_ttl_seconds: 900
  # Pause/stop poll interval: how often a paused runner re-reads the control
  # keys, and how often a sleeping runner wakes to renew its lease.
  control_poll_seconds: 2.0
  # Bounded back-off when the *provider* refuses on quota but the local daily
  # budget still has room. Free-tier limits are both per-minute (RPM/TPM) and
  # per-day (RPD): a 429 that survives the client's retries is usually the
  # per-minute one, so waiting out the rolling 24h RPD window (up to ~24h)
  # would park the runner for a day over a minute-scale throttle. When the
  # local budget is genuinely spent the runner still sleeps to the reset.
  quota_backoff_seconds: 900
  # Mutual exclusion with `scripts/agent/migrate-primary.sh`, which holds
  # `<redis_prefix>:migrating` for the whole `alembic upgrade`. A runner that
  # sees that key launches nothing; with `--continuous` it waits this long for
  # the key to clear and resumes, instead of dying and needing an operator to
  # restart an unattended run. The bound is per *blocked stretch*: consecutive
  # blocked cycles share one budget (so a key that never clears cannot be waited
  # on forever), and any cycle that actually runs starts it over.
  # 0 = never wait (refuse immediately).
  migration_wait_seconds: 1800

# NOTE (v0.13-s1.3): the cloud backfill now derives its backend from
# `ai.enrichment_routing` instead of hardcoding Gemma. With the shipped
# all-local default it refuses to start; set
# `ai.enrichment_routing.{visual,sentiment,deal_verdict}: gemma` (or `gemini`)
# and export GEMINI_API_KEY to run it.

# ---------------------------------------------------------------------------
# Proxy Configuration (scraper HTTP layer — FR-20 / AD-5)
# ---------------------------------------------------------------------------
# Operator enablement: set enabled: true and fill pool (or url), then restart
# scraper workers. Logs emit scraper_proxy_mode (host only, no credentials);
# Redis pipeline:scraper:*:status carries the same safe fields.
# Disable with enabled: false → next scrape is direct (no code change).
# Prefer env / local overrides for real credentials — never commit passwords.
# Platform extra.proxy (non-null) overrides this block; null/absent defers here.
# See docs/setup.md § Proxy rotation.
proxy:
  enabled: false
  url: null                             # single proxy URL (example only — use env for secrets)
  rotation_strategy: round_robin        # round_robin | random
  pool: []                              # list of proxy URLs for rotation
  # pool:
  #   - http://user:pass@proxy1.example:8080
  #   - http://user:pass@proxy2.example:8080

# ---------------------------------------------------------------------------
# Price-Drop Alerts
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  min_drop_pct_default: 5.0   # alert when price drops ≥ 5%
  channels:
    - log                     # always log alerts
    - redis                   # push to Redis for frontend polling
    - email                   # send email alerts
  digest_mode: true           # if true, batch price-drop alerts into a daily email
  digest_email: admin@example.com
  smtp_host: localhost
  smtp_port: 1025
  smtp_user: ""
  smtp_pass: ""
  # Top-new-deals digest (BIN-52) — distinct from digest_mode / send_daily_digest
  top_deals:
    enabled: false
    limit: 10
    min_combined_score: 0.0
    lookback_hours: 168       # 7 days
    score_target: primary     # primary | rent | sale (BIN-107)
    crontab_hour: 8
    crontab_minute: 0
    crontab_day_of_week: "0"  # Sunday
    redis_key: alerts:top_deals_digest

# ---------------------------------------------------------------------------
# Image Storage
# ---------------------------------------------------------------------------
image_storage_path: data/images

# ---------------------------------------------------------------------------
# Pipeline metrics snapshots (Dashboard history — BIN-61)
# ---------------------------------------------------------------------------
pipeline_metrics:
  snapshot_interval_sec: 30   # Celery beat interval for writing snapshots
  retention_days: 7           # prune snapshots older than this

# ---------------------------------------------------------------------------
# Neighbourhood quality fill jobs (BIN-86+)
# ---------------------------------------------------------------------------
# Transit proximity (BIN-89/118): radii + mode weights for GTFS/OSM stop scoring.
# Persists stops into transit_stops; optional Celery beat when enabled=true.
# Offline files only (no live Overpass/GTFS HTTP in CI). Operator CLI:
# scripts/dev/refresh_transit_proximity.py
# OSM amenities (BIN-88): offline GeoJSON or rate-limited Overpass.
neighbourhood_quality:
  transit:
    enabled: false              # set true to schedule Celery beat refresh
    gtfs_dirs: []               # GTFS dirs with stops.txt (required when enabled)
    osm_geojson_paths: []       # OSM Point FeatureCollections (optional)
    interval_hours: 168         # beat cadence when enabled (weekly)
    count_radius_m: 400
    max_radius_m: 1200
    nearest_weight: 0.7
    density_weight: 0.3
    density_cap: 8.0
    mode_weights:
      metro: 1.0
      brt: 0.9
      rail: 0.85
      bus: 0.55
      other: 0.4
  osm_amenities:
    enabled: false              # set true to schedule Celery beat refresh
    mode: geojson               # geojson (offline) | overpass (HTTP)
    poi_geojson_path: ""        # required when mode=geojson
    overpass_url: https://overpass-api.de/api/interpreter
    request_timeout_sec: 60
    rate_limit_per_minute: 8    # politeness sleep between Overpass calls
    buffer_m: 0                 # expand neighbourhood polygon for POI match
    cache_dir: ""               # optional disk cache for Overpass JSON
    cache_ttl_hours: 24
    interval_hours: 168         # beat cadence when enabled (weekly)
    batch_size: 50
    category_targets:
      shop: 3
      park: 1
      school: 1
      healthcare: 2
  # Weak secondary signal from listing LLM flags (BIN-93). Never ground truth.
  listing_claim_stats:
    enabled: false              # set true to schedule Celery beat refresh
    top_n: 10                   # top green/red flag frequencies per nhood
    interval_hours: 24
    min_sample_size: 1          # skip nhoods below this many sentiment rows

# ---------------------------------------------------------------------------
# Neighbourhood access / travel-time to downtown hubs (BIN-90)
# ---------------------------------------------------------------------------
# When base_url is empty, haversine + avg_speed_kmh estimates minutes.
# Point base_url at self-hosted OSRM (e.g. http://localhost:5000) for road routes.
neighbourhood_access:
  enabled: true
  interval_minutes: 1440      # daily Celery beat
  base_url: ""                # OSRM root; empty → haversine fallback
  mode: driving               # OSRM profile / travel mode label
  max_minutes: 45             # score = 1 - minutes/max_minutes (clamped)
  avg_speed_kmh: 30           # haversine → minutes conversion
  request_timeout_sec: 20
  hubs:
    "Belo Horizonte":
      - { id: praca-sete, lat: -19.9191, lon: -43.9386, label: "Praça Sete" }
      - { id: savassi, lat: -19.9386, lon: -43.9378, label: "Savassi" }
    "São Paulo":
      - { id: paulista, lat: -23.5614, lon: -46.6558, label: "Paulista" }
      - { id: se, lat: -23.5505, lon: -46.6333, label: "Sé" }
    "Campinas":
      - { id: centro, lat: -22.9056, lon: -47.0608, label: "Centro" }
