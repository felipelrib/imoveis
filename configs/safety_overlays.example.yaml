# Example path map for crime / safety rate overlays (BIN-92 / BIN-96).
# Copy to configs/safety_overlays.yaml (or pass --config) and point paths at
# local YAML/CSV rate files. Missing paths are skipped with a warning.
# Large dumps belong under data/safety/ (gitignored); do not commit them.
#
# Belo Horizonte (priority):
#   Regional seed is committed at configs/bh_safety_rates.yaml (rebuild with
#   scripts/dev/build_bh_safety_rates.py). Prefer LAI/on-demand bairro CSV:
#     PYTHONPATH=src python scripts/dev/build_bh_safety_rates.py \
#       --bairro-csv data/safety/sejusp_bh_bairro.csv \
#       --out data/safety/bh_crime_rates.yaml
#   See docs/features/73-bh-crime-safety-rates.md.
#
# São Paulo (secondary):
#   1. Download BO microdata from SSP-SP Transparência / Dados Abertos.
#   2. Aggregate by bairro / GeoSampa distrito → rate_per_100k.
#   3. Write YAML/CSV under data/safety/sp_crime_rates.yaml.

cities:
  - city: Belo Horizonte
    state: MG
    provider: sejusp-mg-regional
    path: configs/bh_safety_rates.yaml

  - city: São Paulo
    state: SP
    provider: ssp-sp-bo-rates
    path: data/safety/sp_crime_rates.yaml
