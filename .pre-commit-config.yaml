# Vendored/framework dirs (BMad/WDS skills, BMad runtime — upstream-managed,
# lint noise + update-diff churn) are excluded from STYLE hooks only, mirroring
# the retired CI's paths-ignore. `_bmad/custom/` is project-authored and stays
# covered. Safety hooks (detect-private-key, check-added-large-files) run on
# EVERYTHING — a secret is a secret wherever it lands.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(\.agents/|_bmad/(?!custom/))'
      - id: end-of-file-fixer
        exclude: '^(\.agents/|_bmad/(?!custom/))'
      - id: check-yaml
        exclude: '^(\.agents/|_bmad/(?!custom/))'
      - id: check-json
        exclude: '^(\.agents/|_bmad/(?!custom/))'
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b1
    hooks:
      - id: isort
        args: [--profile, black, --line-length, "127"]
        exclude: '^(\.agents/|_bmad/(?!custom/))'

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--max-line-length, "127", --extend-ignore, "E203,W503,E261,E302,E304,E305,E402,E501,E128,W291"]
        exclude: '^(\.agents/|_bmad/(?!custom/))'

  - repo: local
    hooks:
      - id: forbid-hardcoded-secrets
        name: forbid imoveis/dev secrets
        entry: bash -c '! grep -rnP "(imoveis_secret|dev-secret-key)" src/ frontend/src/ --include="*.py" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx"'
        language: system
        pass_filenames: false

      - id: forbid-only
        name: forbid .only() in test files
        entry: bash -c '! grep -rn "\.only(" src/tests/'
        language: system
        pass_filenames: false

      - id: forbid-print
        name: forbid print() in source code
        entry: bash -c '! grep -rnP "^[^#]*\bprint\s*\(" src/ --include="*.py" | grep -v "__init__.py" | grep -v "test_"'
        language: system
        pass_filenames: false

      - id: forbid-fstring-sql
        name: forbid f-string-built SQL fragments (BIN-135)
        entry: bash -c '! grep -rnP "(\btext\(\s*f[\x27\"]|\bf[\x27\"][^\x27\"]*\b(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM|ORDER BY)\b)" src/ --include="*.py" | grep -v "/tests/"'
        language: system
        pass_filenames: false

      - id: pytest-unit
        name: pytest (unit only)
        entry: pytest src/tests/unit/ -v --timeout=30
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-build
        name: frontend build check
        entry: bash -c 'cd frontend && npm ci && npm run build'
        language: system
        pass_filenames: false
        stages: [pre-push]
