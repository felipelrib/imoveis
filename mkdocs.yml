site_name: Imoveis — Deal Tracker
site_description: Documentation for the real-estate deal-finding pipeline
repo_url: https://github.com/felipelrib/imoveis
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Setup: setup.md
  - Add a locale: i18n/add-a-locale.md
  - Harness Troubleshooting: harness-troubleshooting.md
  - Architecture: architecture.md
  - API Reference: api.md
  - Features:
      - Scraper Framework: features/BIN-166-scraper-framework.md
      - Deduplication Engine: features/BIN-167-deduplication-engine.md
      - AI Enrichment: features/BIN-168-ai-enrichment.md
      - AI Enrich RAM / Concurrency: features/BIN-187-ai-enrich-ram-concurrency.md
      - Scoring Engine: features/BIN-169-scoring-engine.md
      - Price-Drop Alerts: features/BIN-170-price-drop-alerts.md
      - Task Orchestration: features/BIN-171-task-orchestration.md
      - REST API: features/BIN-172-rest-api.md
      - Frontend Dashboard: features/BIN-173-frontend-dashboard.md
      - Infrastructure: features/BIN-174-infrastructure.md
      - Favourites & Saved Searches: features/BIN-13-favourites-and-saved-searches.md
      - Config YAML Loader: features/BIN-5-config-yaml-loader.md
      - Circuit Breaker & Checkpoint: features/BIN-17-circuit-breaker-and-checkpoint.md
      - Image Store & VLM Pipeline: features/BIN-175-image-store-and-vlm-pipeline.md
      - Interactive Map: features/BIN-14-interactive-map.md
      - Deal Summary Enrichment: features/BIN-12-deal-summary-enrichment.md
      - Per-Platform Listings: features/BIN-30-per-platform-listings.md
      - Watchlist Price-Drop Alerts: features/BIN-10-watchlist-price-drop-alerts.md
      - Admin Control Panel: features/BIN-176-admin-control-panel.md
      - System Status & Pipeline Telemetry: features/BIN-177-system-status-and-pipeline-telemetry.md
      - AppConfig API Credential: features/BIN-44-appconfig-api-credential.md
      - Frontend Credential Gate: features/BIN-46-frontend-credential-gate.md
      - Symlink Cursor Harness: features/BIN-185-symlink-cursor-harness.md
      - Harness Surgery (primary-safe validation, local merge gate): features/v0.13-fu1-harness-surgery.md
      - Backfill completion detection and non-enrichable accounting: features/v0.13-fu3-backfill-completion-detection.md
  - ADR:
      - Dual-Model Development (superseded): adr/0001-dual-model-development.md
      - Cursor Single-Agent Workflow: adr/0002-cursor-single-agent-workflow.md
      - BMad Planning Bridge: adr/0003-bmad-planning-bridge.md
      - Parallel Agent Workspaces: adr/0004-parallel-agent-workspaces.md
      - Drop Linear — BMad Artifacts Sole Tracker: adr/0005-drop-linear-bmad-artifacts-sole-tracker.md

plugins:
  - search
  - minify:
      minify_html: true
