name: Nightly

# Non-gating safety nets that watch EXTERNAL surfaces: the live scraper drift
# canary (portal HTML) and the dependency advisory audit (PyPI / npm). Code
# validation runs locally via scripts/agent/validate.py (the only merge gate).

on:
  schedule:
    - cron: "0 3 * * *"  # 3 AM UTC daily
  workflow_dispatch:

jobs:
  # ---- Scrapers: cassettes + live drift canary ----
  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cassette unit tests + live dry-run
        run: python scripts/agent/validate.py --only scrapers

  # ---- Dependencies: advisory audit (pip-audit + npm audit) ----
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audit tools
        run: pip install -r requirements.txt pip-audit

      - name: Dependency audit (advisory)
        run: bash scripts/ops/audit-deps.sh
