name: Nightly

# Post-CI-retirement (v0.13-fu1 harness surgery): the only job left is the
# live scraper drift canary — it watches an EXTERNAL surface (portal HTML)
# that local gates cannot cover. Unit/integration/dependency jobs were
# deleted; those run locally via scripts/agent/validate.sh, the sole gate.

on:
  schedule:
    - cron: "0 3 * * *"  # 3 AM UTC daily
  workflow_dispatch:

jobs:
  # ---- Scrapers: cassettes + live drift canary ----
  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-timeout

      - name: Cassette unit tests + live dry-run
        run: bash scripts/agent/validate-scrapers.sh --require-live
